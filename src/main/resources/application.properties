spring.application.name=voyageguard-payment
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3309/voyageguard_payment
spring.datasource.username=root
spring.datasource.password=voyageguard1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
# Outbox payload가 이미 직렬화된 JSON 문자열이라, Kafka 레벨에서는 그냥 String으로만 주고받음
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Toss Payments 시크릿 키
toss.secret-key=${TOSS_SECRET_KEY:}

# Auth 서비스가 발급한 JWT를 검증만 함(개인키 없음) - JwtVerifier 참고
jwt.public-

# Sales 서비스 주소 - 결제 요청 시 예약 상태/소유자 확인(REST)에 사용
sales.service.base-url=http://localhost:8082

management.endpoints.web.exposure.include=health,prometheus

# p95/p99 같은 percentile 계산에 필요한 히스토그램 버킷 데이터를 생성함
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 콘솔뿐 아니라 파일로도 로그를 남김(레포 안 logs/, gitignore 처리) - Promtail이 이 파일을
# 지켜보다가 Loki로 보냄
logging.file.name=logs/payment.log

# 로그를 JSON(ECS 스키마)으로 남김 - Loki에서 필드별 필터링 가능해짐
logging.structured.format.console=ecs
logging.structured.format.file=ecs
